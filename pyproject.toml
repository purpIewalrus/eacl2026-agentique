[project]
name = "eacl2026-agentique"
version = "0.1.0"
description = "Une proposition de structure agentique pour la tâche du repo"
authors = [
    { name = "purplewalrus", email = "eloise.delerue@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=0.27.0",
    "requests>=2.25.0",
    "tqdm>=4.60.0",
]

[project.scripts]
eacl2026-agentique = "eacl2026_agentique:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
